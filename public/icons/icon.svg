<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#14241b"/>
      <stop offset="60%" stop-color="#0a120e"/>
      <stop offset="100%" stop-color="#040705"/>
    </radialGradient>

    <!-- Gold Foil Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2b2"/>
      <stop offset="25%" stop-color="#e6b34b"/>
      <stop offset="50%" stop-color="#fff7d6"/>
      <stop offset="75%" stop-color="#c48a28"/>
      <stop offset="100%" stop-color="#9a6712"/>
    </linearGradient>

    <!-- Emerald Glow Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Rounded Squircle Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.6"/>

  <!-- Chamfered HUD Inner Frame -->
  <polygon points="64,28 448,28 484,64 484,448 448,484 64,484 28,448 28,64" 
           fill="none" stroke="url(#goldGrad)" stroke-width="2.5" opacity="0.35"/>

  <!-- Shield Crest Background -->
  <g transform="translate(0, 10)">
    <path d="M 256 60 Q 370 75 400 160 Q 405 315 256 425 Q 107 315 112 160 Q 142 75 256 60 Z" 
          fill="#060c08" stroke="url(#goldGrad)" stroke-width="9" filter="url(#goldGlow)"/>

    <path d="M 256 80 Q 355 92 380 168 Q 385 295 256 395 Q 127 295 132 168 Q 157 92 256 80 Z" 
          fill="none" stroke="#e6b34b" stroke-width="2.5" opacity="0.7"/>

    <!-- Central Emerald Emblem Diamond -->
    <polygon points="256,120 336,200 256,280 176,200" fill="url(#emeraldGrad)" opacity="0.15"/>
    <polygon points="256,120 336,200 256,280 176,200" fill="none" stroke="url(#emeraldGrad)" stroke-width="3"/>

    <!-- Gold Dollar Monogram Symbol ($) -->
    <text x="256" y="278" font-family="'Cinzel', serif" font-size="160" font-weight="900" 
          text-anchor="middle" fill="url(#goldGrad)" filter="url(#goldGlow)">$</text>

    <!-- Aura Star Points -->
    <circle cx="256" cy="115" r="7" fill="#fff7d6"/>
    <circle cx="256" cy="355" r="6" fill="#fff7d6"/>
    <circle cx="170" cy="200" r="5" fill="#34d399"/>
    <circle cx="342" cy="200" r="5" fill="#34d399"/>
  </g>
</svg>
